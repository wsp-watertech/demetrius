[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demetrius"
version = "0.1.0"
description = "High-resolution DEM assembly from USGS 3DEP data for engineering applications"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Thomas Williams", email = "thomas.williams@wsp.com"}]
requires-python = ">=3.12"
keywords = ["dem", "usgs", "3dep", "elevation", "hydraulic-modeling", "gis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "click>=8.0",
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "pyarrow>=15.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "gdal>=3.8",
]

[project.urls]
Homepage = "https://github.com/demetrius-dem/demetrius"
Repository = "https://github.com/demetrius-dem/demetrius"
Issues = "https://github.com/demetrius-dem/demetrius/issues"

[project.scripts]
demetrius = "demetrius.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/demetrius"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/demetrius/data",
]
