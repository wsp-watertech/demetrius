[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demetrius"
version = "0.1.0"
description = "High-resolution DEM assembly from USGS 3DEP data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "pyarrow>=15.0",
    "shapely>=2.0",
    "gdal>=3.8",
]

[project.scripts]
demetrius = "demetrius.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
