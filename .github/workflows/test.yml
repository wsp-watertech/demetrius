name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.12", "3.13", "3.14" ]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install GDAL system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
        echo "CPLUS_INCLUDE_PATH=/usr/include/gdal" >> "$GITHUB_ENV"
        echo "C_INCLUDE_PATH=/usr/include/gdal" >> "$GITHUB_ENV"
        echo "GDAL_VERSION=$(gdal-config --version)" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        # Pin the GDAL Python bindings to the exact system libgdal version
        # (the bindings require an exact match, but pyproject.toml only
        # specifies a lower bound so the resolver would otherwise grab latest).
        pip install "gdal==${GDAL_VERSION}"
        pip install -e ".[dev]"
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/
    
    - name: Run tests
      run: |
        pytest -v --cov=src --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
